services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: changoff
      POSTGRES_USER: changoff
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changoff-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U changoff -d changoff"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/changoff
      DB_USER: changoff
      DB_PASSWORD: ${DB_PASSWORD:-changoff-local}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
