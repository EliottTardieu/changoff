spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/changoff}
spring.datasource.username=${DB_USER:changoff}
spring.datasource.password=${DB_PASSWORD:changoff-local}
spring.flyway.enabled=true
server.error.include-message=never
server.servlet.session.cookie.http-only=true
app.secure-cookie=${SECURE_COOKIE:false}
server.forward-headers-strategy=framework
